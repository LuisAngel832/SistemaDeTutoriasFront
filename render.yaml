# Blueprint de Render para desplegar el frontend como Static Site.
# Importa este repo en Render (New + > Blueprint) y se creara el servicio.
services:
  - type: web
    name: tutorias-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Despliega un commit de main solo cuando pasan sus checks de GitHub (job `verificar` de
    # .github/workflows/ci.yml). Si un check falla o no hay checks, Render no despliega.
    autoDeployTrigger: checksPass
    envVars:
      # URL del backend que se "hornea" en el bundle durante el build.
      - key: VITE_API_URL
        value: https://tutoriasbe.onrender.com
      # DSN de Sentry o GlitchTip (publico). Sin valor no se envian errores. El release es el
      # SHA del commit (RENDER_GIT_COMMIT, que Render define en el build).
      - key: VITE_SENTRY_DSN
        sync: false
    # Cabeceras de seguridad. Mantenerlas iguales a CABECERAS_SEGURIDAD de vite.config.js,
    # que las aplica en `npm run preview` para probarlas en local.
    # La CSP va en modo Report-Only: el navegador avisa en consola de lo que bloquearia, sin
    # bloquearlo. Cuando no haya avisos, renombrar a Content-Security-Policy.
    # - style-src 'unsafe-inline': sonner inyecta un <style> en tiempo de ejecucion.
    # - connect-src: si cambia VITE_API_URL, actualizar tambien aqui. *.sentry.io recibe los
    #   errores; con GlitchTip u otro host, cambiarlo por el del DSN.
    headers:
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://tutoriasbe.onrender.com https://*.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    # Regla SPA: cualquier ruta sirve index.html para que React Router maneje
    # el enrutado del lado cliente (evita 404 al recargar /tutor/home, etc.).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
